<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Excalidraw Canvas</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root { width: 100%; height: 100%; overflow: hidden; }
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 16px; background: #f8f9fa; border-bottom: 1px solid #e9ecef;
      height: 48px; z-index: 10;
    }
    .header h1 { font-size: 16px; font-weight: 600; }
    .controls { display: flex; align-items: center; gap: 12px; }
    .status { display: flex; align-items: center; gap: 6px; font-size: 13px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; }
    .status-connected { background: #22c55e; }
    .status-disconnected { background: #ef4444; }
    .canvas-container { width: 100%; height: calc(100% - 48px); }
    .btn { padding: 4px 12px; border-radius: 6px; border: 1px solid #d1d5db; background: white; cursor: pointer; font-size: 13px; }
    .btn:hover { background: #f3f4f6; }
    .sync-info { font-size: 12px; color: #6b7280; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
