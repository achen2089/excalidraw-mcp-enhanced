<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Excalidraw MCP Enhanced</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; background: #ffffff; border-bottom: 1px solid #e5e7eb;
      height: 44px; z-index: 10;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .header-logo { font-size: 18px; }
    .header-title { font-size: 14px; font-weight: 700; color: #111827; letter-spacing: -0.3px; }
    .header-badge {
      font-size: 10px; font-weight: 600; color: #6366f1; background: #eef2ff;
      padding: 2px 6px; border-radius: 4px; letter-spacing: 0.5px;
    }

    .header-right { display: flex; align-items: center; gap: 12px; }

    .status-pill {
      display: flex; align-items: center; gap: 5px;
      font-size: 12px; color: #6b7280;
      padding: 3px 10px; border-radius: 12px;
      background: #f9fafb; border: 1px solid #e5e7eb;
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .status-connected { background: #22c55e; box-shadow: 0 0 4px rgba(34,197,94,0.4); }
    .status-disconnected { background: #ef4444; box-shadow: 0 0 4px rgba(239,68,68,0.4); }

    .element-count {
      font-size: 12px; color: #9ca3af; font-variant-numeric: tabular-nums;
    }

    .btn {
      padding: 4px 12px; border-radius: 6px; border: 1px solid #d1d5db;
      background: white; cursor: pointer; font-size: 12px; font-weight: 500;
      color: #374151; transition: all 0.15s;
    }
    .btn:hover { background: #f9fafb; border-color: #9ca3af; }
    .btn:active { background: #f3f4f6; }
    .btn-danger { color: #dc2626; }
    .btn-danger:hover { background: #fef2f2; border-color: #fca5a5; }

    .canvas-container { width: 100%; height: calc(100% - 44px); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
